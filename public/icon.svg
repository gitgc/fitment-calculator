<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0d1117"/>
  <!-- outer tyre -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#f0b429" stroke-width="44"/>
  <!-- rim barrel -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#58a6ff" stroke-width="22"/>
  <!-- spokes (4-lug style) -->
  <line x1="256" y1="128" x2="256" y2="224" stroke="#58a6ff" stroke-width="18" stroke-linecap="round"/>
  <line x1="256" y1="288" x2="256" y2="384" stroke="#58a6ff" stroke-width="18" stroke-linecap="round"/>
  <line x1="128" y1="256" x2="224" y2="256" stroke="#58a6ff" stroke-width="18" stroke-linecap="round"/>
  <line x1="288" y1="256" x2="384" y2="256" stroke="#58a6ff" stroke-width="18" stroke-linecap="round"/>
  <!-- diagonal spokes -->
  <line x1="173" y1="173" x2="228" y2="228" stroke="#58a6ff" stroke-width="14" stroke-linecap="round"/>
  <line x1="284" y1="284" x2="339" y2="339" stroke="#58a6ff" stroke-width="14" stroke-linecap="round"/>
  <line x1="339" y1="173" x2="284" y2="228" stroke="#58a6ff" stroke-width="14" stroke-linecap="round"/>
  <line x1="228" y1="284" x2="173" y2="339" stroke="#58a6ff" stroke-width="14" stroke-linecap="round"/>
  <!-- centre hub -->
  <circle cx="256" cy="256" r="36" fill="#f0b429"/>
  <circle cx="256" cy="256" r="18" fill="#0d1117"/>
</svg>
