<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wheels Fitment — Wheel Fitment Calculator</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --card: #21262d;
  --border: #30363d;
  --old: #58a6ff;
  --new: #f78166;
  --accent: #f0b429;
  --text: #e6edf3;
  --muted: #8b949e;
  --pos: #3fb950;
  --neg: #f78166;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1.5rem 2rem; text-align: center; }
header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; color: var(--accent); }
header p { color: var(--muted); font-size: 0.9rem; margin-top: 0.3rem; }

main { max-width: 1080px; margin: 0 auto; padding: 2rem 1rem 4rem; }

.inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.5rem; }
@media (max-width: 640px) { .inputs { grid-template-columns: 1fr; } }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.4rem;
}
.card.old { border-top: 3px solid var(--old); }
.card.new { border-top: 3px solid var(--new); }

.card h2 { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1.1rem; }
.card.old h2 { color: var(--old); }
.card.new h2 { color: var(--new); }

.section-label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 1rem 0 0.6rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; }
.section-label:first-of-type { margin-top: 0; }

.field { margin-bottom: 0.75rem; }
.field label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.3rem; }
.field input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 0.55rem 0.75rem;
  font-size: 0.95rem;
  transition: border-color 0.15s;
}
.field input:focus { outline: none; border-color: var(--accent); }

.btn-row { text-align: center; margin-bottom: 2rem; }
.calc-btn {
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 8px;
  padding: 0.8rem 2.5rem;
  font-size: 1rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
}
.calc-btn:hover { opacity: 0.88; transform: translateY(-1px); }
.calc-btn:active { transform: translateY(0); }

#results { display: none; }
#results.show { display: block; }

.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 1.5rem; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
thead tr { background: var(--card); }
th { padding: 0.75rem 1rem; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; text-align: right; color: var(--muted); }
th:first-child { text-align: left; }
th.old { color: var(--old); }
th.new { color: var(--new); }
th.diff { color: var(--accent); }
td { padding: 0.7rem 1rem; text-align: right; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
td:first-child { text-align: left; color: var(--muted); font-size: 0.82rem; }
tbody tr:hover { background: rgba(255,255,255,0.025); }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.neu { color: var(--muted); }

.diagram-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
.diagram-wrap h3 { text-align: center; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.75rem; }
.legend { display: flex; justify-content: center; gap: 2rem; margin-bottom: 1rem; }
.legend-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: var(--muted); }
.swatch { width: 20px; height: 3px; border-radius: 2px; }
canvas { display: block; margin: 0 auto; max-width: 100%; border-radius: 8px; }

#tip {
  position: fixed; z-index: 200; pointer-events: none;
  background: #1f2937; color: #e6edf3;
  border: 1px solid #374151; border-radius: 8px;
  padding: 0.5rem 0.8rem; font-size: 0.8rem; line-height: 1.5;
  max-width: 260px; opacity: 0; transition: opacity 0.12s;
}
[data-tip] { cursor: help; }
</style>
</head>
<body>
<header>
  <h1>Wheels Fitment</h1>
  <p>Wheel &amp; Tyre Fitment Calculator</p>
</header>
<main>
  <div class="inputs">
    <div class="card old">
      <h2>Current Setup</h2>
      <p class="section-label">Rim</p>
      <div class="field"><label>Diameter (inches)</label><input type="number" id="o-d" value="17" step="0.5"></div>
      <div class="field"><label>Width (inches)</label><input type="number" id="o-w" value="7.5" step="0.5"></div>
      <div class="field"><label>Offset / ET (mm)</label><input type="number" id="o-et" value="45" step="1"></div>
      <p class="section-label">Tyre</p>
      <div class="field"><label>Width (mm)</label><input type="number" id="o-tw" value="225" step="5"></div>
      <div class="field"><label>Profile (%)</label><input type="number" id="o-pr" value="45" step="5"></div>
      <p class="section-label">Optional</p>
      <div class="field"><label>Spacer (mm)</label><input type="number" id="o-sp" value="0" step="1" min="0"></div>
      <div class="field"><label>Camber (°)</label><input type="number" id="o-cam" value="0" step="0.5"></div>
    </div>
    <div class="card new">
      <h2>New Setup</h2>
      <p class="section-label">Rim</p>
      <div class="field"><label>Diameter (inches)</label><input type="number" id="n-d" value="18" step="0.5"></div>
      <div class="field"><label>Width (inches)</label><input type="number" id="n-w" value="8.5" step="0.5"></div>
      <div class="field"><label>Offset / ET (mm)</label><input type="number" id="n-et" value="40" step="1"></div>
      <p class="section-label">Tyre</p>
      <div class="field"><label>Width (mm)</label><input type="number" id="n-tw" value="235" step="5"></div>
      <div class="field"><label>Profile (%)</label><input type="number" id="n-pr" value="40" step="5"></div>
      <p class="section-label">Optional</p>
      <div class="field"><label>Spacer (mm)</label><input type="number" id="n-sp" value="0" step="1" min="0"></div>
      <div class="field"><label>Camber (°)</label><input type="number" id="n-cam" value="0" step="0.5"></div>
    </div>
  </div>

  <div class="btn-row">
    <button class="calc-btn" onclick="calculate()">Calculate Fitment</button>
  </div>

  <div id="results">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Measurement</th>
            <th class="old">Current</th>
            <th class="new">New</th>
            <th class="diff">Difference</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="diagram-wrap">
      <h3>Cross Section Comparison</h3>
      <div class="legend">
        <div class="legend-item"><div class="swatch" style="background:var(--old)"></div>Current Setup</div>
        <div class="legend-item"><div class="swatch" style="background:var(--new)"></div>New Setup</div>
      </div>
      <canvas id="cv" width="900" height="620"></canvas>
    </div>
  </div>
</main>

<script>
function v(id) { return parseFloat(document.getElementById(id).value) || 0; }

function calc(rimIn, rimWin, et, tw, pr, spacer) {
  const rimDmm = rimIn * 25.4;
  const rimWmm = rimWin * 25.4;
  const sw = tw * pr / 100;
  const od = rimDmm + 2 * sw;
  const circ = Math.PI * od;
  const sp = spacer || 0;
  const effectiveET = et - sp;
  const inset = rimWmm / 2 + effectiveET;
  const poke  = rimWmm / 2 - effectiveET;
  return { rimIn, rimDmm, rimWin, rimWmm, et, sp, effectiveET, tw, pr, sw, od, circ, inset, poke };
}

function fmt(n, d = 1) { return n.toFixed(d); }

function diffHTML(diff, unit, negGood = false) {
  const rounded = Math.round(diff * 10) / 10;
  if (Math.abs(rounded) < 0.05) return `<span class="neu">0 ${unit}</span>`;
  const positive = diff > 0;
  const good = negGood ? !positive : positive;
  const cls = 'neu'; // neutral gray for diff — let user decide if good/bad
  const sign = positive ? '+' : '';
  return `<span>${sign}${fmt(diff)} ${unit}</span>`;
}

function calculate() {
  const o = calc(v('o-d'), v('o-w'), v('o-et'), v('o-tw'), v('o-pr'), v('o-sp'));
  const n = calc(v('n-d'), v('n-w'), v('n-et'), v('n-tw'), v('n-pr'), v('n-sp'));
  const oCam = v('o-cam');
  const nCam = v('n-cam');

  const speedoErr = (o.circ - n.circ) / n.circ * 100;
  const r30 = 30 * o.circ / n.circ;
  const r60 = 60 * o.circ / n.circ;
  const rhGain = (n.od - o.od) / 2;
  const agLoss = rhGain;

  const sign = x => x > 0 ? '+' : '';
  const d = (val, unit) => {
    const r = Math.round(val * 10) / 10;
    if (Math.abs(r) < 0.05) return `<span class="neu">—</span>`;
    return `${sign(val)}${fmt(val)} ${unit}`;
  };

  const tips = {
    'Diameter':          'Total outer diameter of the tyre from tread to tread (mm). A taller tyre increases this value.',
    'Circumference':     'Total rolling circumference of the tyre (mm). This is what determines how far the car travels per wheel revolution — and drives speedo accuracy.',
    'Poke':              'How far the outer rim edge extends beyond the hub mounting face (mm). Positive = wheel pokes outward. Too much poke and the tyre can foul the arch or bodywork.',
    'Inset':             'Distance from the inner rim lip to the hub mounting face, also called backspacing (mm). Too little inset and the wheel can foul inner suspension or brake components.',
    'Speedo Error':      'How much the speedometer reads relative to your actual speed with the new tyres. Negative = speedo under-reads (shows less than actual). Caused by a change in rolling circumference.',
    'Reading at 30 mph': 'What your speedometer displays when you are actually travelling at 30 mph with the new tyres. A larger tyre means fewer wheel revolutions, so the speedo reads low.',
    'Reading at 60 mph': 'What your speedometer displays when you are actually travelling at 60 mph with the new tyres.',
    'Ride Height Gain':  'How much the car body rises due to the change in tyre radius (mm). Positive = car sits higher. Affects handling geometry and headlight aim.',
    'Arch Gap Loss':     'Reduction in clearance between the outer tyre tread and the wheel arch liner (mm). Positive = less gap. Watch for rubbing on bumps or full lock.',
  };

  const rows = [
    ['Diameter',          fmt(o.od) + ' mm',   fmt(n.od) + ' mm',          d(n.od - o.od, 'mm')],
    ['Circumference',     fmt(o.circ) + ' mm', fmt(n.circ) + ' mm',        d(n.circ - o.circ, 'mm')],
    ['Poke',              fmt(o.poke) + ' mm', fmt(n.poke) + ' mm',        d(n.poke - o.poke, 'mm')],
    ['Inset',             fmt(o.inset) + ' mm',fmt(n.inset) + ' mm',       d(n.inset - o.inset, 'mm')],
    ['Speedo Error',      '0.00 %',            fmt(speedoErr, 2) + ' %',   d(speedoErr, '%')],
    ['Reading at 30 mph', '30.0 mph',          fmt(r30, 1) + ' mph',       d(r30 - 30, 'mph')],
    ['Reading at 60 mph', '60.0 mph',          fmt(r60, 1) + ' mph',       d(r60 - 60, 'mph')],
    ['Ride Height Gain',  '0.0 mm',            fmt(rhGain) + ' mm',        d(rhGain, 'mm')],
    ['Arch Gap Loss',     '0.0 mm',            fmt(agLoss) + ' mm',        d(agLoss, 'mm')],
  ];

  document.getElementById('tbody').innerHTML = rows.map(([label, ov, nv, dv]) =>
    `<tr><td data-tip="${tips[label] || ''}">${label}</td><td>${ov}</td><td>${nv}</td><td>${dv}</td></tr>`
  ).join('');

  document.getElementById('results').classList.add('show');
  drawDiagram(o, n, oCam, nCam);
}

function rrPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function arrow(ctx, x1, y1, x2, y2, col) {
  ctx.save();
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const ang = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - 7 * Math.cos(ang - 0.4), y2 - 7 * Math.sin(ang - 0.4));
  ctx.lineTo(x2 - 7 * Math.cos(ang + 0.4), y2 - 7 * Math.sin(ang + 0.4));
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// Builds the tyre rubber cross-section path.
// Sidewalls use quadratic curves; shoulder corners are rounded with radius sr.
function tyrePath(ctx, rimCX, cy, tHW, tHH, rHW, rHH) {
  const sr = Math.min((tHH - rHH) * 0.32, tHW * 0.18, 14); // shoulder radius

  ctx.beginPath();
  ctx.moveTo(rimCX - tHW + sr, cy - tHH);                                          // top tread start
  ctx.lineTo(rimCX + tHW - sr, cy - tHH);                                          // top tread →
  ctx.quadraticCurveTo(rimCX + tHW, cy - tHH, rimCX + tHW, cy - tHH + sr);       // top-right shoulder
  ctx.quadraticCurveTo(rimCX + tHW, cy - rHH, rimCX + rHW, cy - rHH);            // right upper sidewall
  ctx.lineTo(rimCX + rHW, cy + rHH);                                               // right bead seat ↓
  ctx.quadraticCurveTo(rimCX + tHW, cy + rHH, rimCX + tHW, cy + tHH - sr);       // right lower sidewall
  ctx.quadraticCurveTo(rimCX + tHW, cy + tHH, rimCX + tHW - sr, cy + tHH);       // bottom-right shoulder
  ctx.lineTo(rimCX - tHW + sr, cy + tHH);                                          // bottom tread ←
  ctx.quadraticCurveTo(rimCX - tHW, cy + tHH, rimCX - tHW, cy + tHH - sr);       // bottom-left shoulder
  ctx.quadraticCurveTo(rimCX - tHW, cy + rHH, rimCX - rHW, cy + rHH);            // left lower sidewall
  ctx.lineTo(rimCX - rHW, cy - rHH);                                               // left bead seat ↑
  ctx.quadraticCurveTo(rimCX - tHW, cy - rHH, rimCX - tHW, cy - tHH + sr);       // left upper sidewall
  ctx.quadraticCurveTo(rimCX - tHW, cy - tHH, rimCX - tHW + sr, cy - tHH);       // top-left shoulder
  ctx.closePath();
}

// Draw one tyre/rim cross-section. Hub mounting face is at hubX.
function drawSetup(ctx, w, hubX, cy, scale, color, camberDeg) {
  const tHW   = w.tw     / 2 * scale;
  const tHH   = w.od     / 2 * scale;
  const rHW   = w.rimWmm / 2 * scale;
  const rHH   = w.rimDmm / 2 * scale;
  const rimCX = hubX - w.effectiveET * scale;

  ctx.save();
  if (camberDeg) {
    ctx.translate(rimCX, cy);
    ctx.rotate(camberDeg * Math.PI / 180);
    ctx.translate(-rimCX, -cy);
  }

  // ── Tyre rubber fill ──────────────────────────────────────
  ctx.fillStyle = color + '20';
  tyrePath(ctx, rimCX, cy, tHW, tHH, rHW, rHH);
  ctx.fill();

  // ── Tread pattern (clipped to tyre shape) ─────────────────
  ctx.save();
  tyrePath(ctx, rimCX, cy, tHW, tHH, rHW, rHH);
  ctx.clip();
  const treadD  = Math.min(15, (tHH - rHH) * 0.22);
  const nGroove = 5;
  const bandH   = treadD / nGroove;
  ctx.fillStyle = color + '2e';
  for (let i = 1; i < nGroove; i += 2) {
    ctx.fillRect(rimCX - tHW, cy - tHH + i * bandH,     tHW * 2, bandH);
    ctx.fillRect(rimCX - tHW, cy + tHH - (i+1) * bandH, tHW * 2, bandH);
  }
  ctx.restore();

  // ── Tyre outline ──────────────────────────────────────────
  ctx.strokeStyle = color + 'cc';
  ctx.lineWidth = 2.5;
  tyrePath(ctx, rimCX, cy, tHW, tHH, rHW, rHH);
  ctx.stroke();

  // ── Rim barrel ────────────────────────────────────────────
  ctx.fillStyle   = color + '14';
  ctx.strokeStyle = color + '55';
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.rect(rimCX - rHW, cy - rHH, rHW * 2, rHH * 2);
  ctx.fill();
  ctx.stroke();

  ctx.restore(); // undo camber rotation
}

// Horizontal measurement row.
// tag   → right-aligned left of the hub tick  (never overlaps arrow)
// detail → left-aligned right of the outer tick, clamped to maxX
function pokeRow(ctx, hubX, outerX, y, color, tag, detail, maxX) {
  ctx.strokeStyle = color + '88';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(hubX,   y - 5); ctx.lineTo(hubX,   y + 5);
  ctx.moveTo(outerX, y - 5); ctx.lineTo(outerX, y + 5);
  ctx.stroke();
  arrow(ctx, hubX, y, outerX, y, color + 'aa');

  ctx.fillStyle = color + 'cc';
  ctx.font      = '16px monospace';

  // Tag left of hub
  ctx.textAlign = 'right';
  ctx.fillText(tag, hubX - 8, y + 5);

  // Detail right of outer tick, clamped
  const tw = ctx.measureText(detail).width;
  let lx = outerX + 8;
  if (maxX !== undefined && lx + tw > maxX) lx = maxX - tw - 4;
  ctx.textAlign = 'left';
  ctx.fillText(detail, lx, y + 5);
}

// Hub, brake disc and caliper cross-section on the inboard (left) side of hubX
function drawHub(ctx, hubX, cy, rHH) {
  const fR = rHH * 0.44;
  const fD = Math.max(12, rHH * 0.08);
  const hR = rHH * 0.19;
  const hD = rHH * 0.52;

  // Axle stub
  ctx.fillStyle = '#161f2e'; ctx.strokeStyle = '#2d3748'; ctx.lineWidth = 1;
  ctx.fillRect(hubX - fD - hD, cy - hR, hD, hR * 2);
  ctx.strokeRect(hubX - fD - hD, cy - hR, hD, hR * 2);

  // Hub flange
  ctx.fillStyle = '#253044'; ctx.strokeStyle = '#4a6080'; ctx.lineWidth = 1.5;
  ctx.fillRect(hubX - fD, cy - fR, fD, fR * 2);
  ctx.strokeRect(hubX - fD, cy - fR, fD, fR * 2);

  // Mounting face line
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(hubX, cy - fR - 10); ctx.lineTo(hubX, cy + fR + 10); ctx.stroke();
}

function drawDiagram(o, n, oCam, nCam) {
  const canvas = document.getElementById('cv');
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  // Layout margins — top only needs legend, bottom needs two info rows
  const sidePad = 90;
  const topPad  = 46;
  const botPad  = 110;

  const availW = W - 2 * sidePad;
  const availH = H - topPad - botPad;

  const maxIn  = Math.max(o.tw/2 + o.effectiveET, n.tw/2 + n.effectiveET);
  const maxOut = Math.max(o.tw/2 - o.effectiveET, n.tw/2 - n.effectiveET);
  const maxOD  = Math.max(o.od, n.od);

  const scale = Math.min(availW / (maxIn + maxOut), availH / maxOD);

  const drawnW = (maxIn + maxOut) * scale;
  const hubX   = (W - drawnW) / 2 + maxIn * scale;
  const cy     = topPad + availH / 2;

  // ── Tyres ─────────────────────────────────────────────────
  drawSetup(ctx, o, hubX, cy, scale, '#58a6ff', oCam);
  drawSetup(ctx, n, hubX, cy, scale, '#f78166', nCam);

  const oTH   = o.od * scale;
  const nTH   = n.od * scale;
  const maxTH = Math.max(oTH, nTH);

  // ── Hub ───────────────────────────────────────────────────
  const avgRHH = (o.rimDmm / 2 + n.rimDmm / 2) / 2 * scale;
  drawHub(ctx, hubX, cy, avgRHH);

  // ── Diameter callouts — vertical arrows, labels at mid-height
  const oRimCX = hubX - o.effectiveET * scale;
  const nRimCX = hubX - n.effectiveET * scale;

  const oDLeft = oRimCX - o.tw/2 * scale;
  const aL = oDLeft - 26;

  ctx.save();
  ctx.setLineDash([2, 4]);
  ctx.strokeStyle = '#58a6ff33'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(oDLeft, cy - oTH/2); ctx.lineTo(aL + 4, cy - oTH/2);
  ctx.moveTo(oDLeft, cy + oTH/2); ctx.lineTo(aL + 4, cy + oTH/2);
  ctx.stroke();
  ctx.restore();

  arrow(ctx, aL, cy + oTH/2, aL, cy - oTH/2, '#58a6ffaa');
  ctx.fillStyle = '#58a6ff'; ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'right';
  ctx.fillText('Ø' + o.od.toFixed(0) + ' mm', aL - 6, cy + 6);

  const nDRight = nRimCX + n.tw/2 * scale;
  const aR = nDRight + 26;

  ctx.save();
  ctx.setLineDash([2, 4]);
  ctx.strokeStyle = '#f7816633'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(nDRight, cy - nTH/2); ctx.lineTo(aR - 4, cy - nTH/2);
  ctx.moveTo(nDRight, cy + nTH/2); ctx.lineTo(aR - 4, cy + nTH/2);
  ctx.stroke();
  ctx.restore();

  arrow(ctx, aR, cy + nTH/2, aR, cy - nTH/2, '#f78166aa');
  ctx.fillStyle = '#f78166'; ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('Ø' + n.od.toFixed(0) + ' mm', aR + 6, cy + 6);

  // ── Info rows below tyre — width + ET + poke per setup ───
  const py1 = cy + maxTH/2 + 28;
  const py2 = py1 + 44;

  const oETlabel = o.sp ? 'ET' + o.et + ' -' + o.sp + 'sp' : 'ET' + o.et;
  const nETlabel = n.sp ? 'ET' + n.et + ' -' + n.sp + 'sp' : 'ET' + n.et;
  pokeRow(ctx, hubX, oRimCX + o.rimWmm/2 * scale, py1,
    '#58a6ff', 'Current', o.tw + ' mm wide   ' + oETlabel + '   poke ' + o.poke.toFixed(1) + ' mm', W - 8);
  pokeRow(ctx, hubX, nRimCX + n.rimWmm/2 * scale, py2,
    '#f78166', 'New', n.tw + ' mm wide   ' + nETlabel + '   poke ' + n.poke.toFixed(1) + ' mm', W - 8);

  // ── Legend ────────────────────────────────────────────────
  ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = '#58a6ff'; ctx.fillText('■ Current', W/2 - 60, 28);
  ctx.fillStyle = '#f78166'; ctx.fillText('■ New',     W/2 + 48, 28);
}

// Auto-calculate on load with default values
window.onload = calculate;

// Floating tooltip
const tip = document.createElement('div');
tip.id = 'tip';
document.body.appendChild(tip);

document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-tip]');
  if (!el || !el.dataset.tip) return;
  tip.textContent = el.dataset.tip;
  tip.style.opacity = '1';
});

document.addEventListener('mouseout', e => {
  if (e.target.closest('[data-tip]')) tip.style.opacity = '0';
});

document.addEventListener('mousemove', e => {
  if (tip.style.opacity === '0') return;
  const pad = 12;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  const x = e.clientX + pad + tw > window.innerWidth  ? e.clientX - tw - pad : e.clientX + pad;
  const y = e.clientY + pad + th > window.innerHeight ? e.clientY - th - pad : e.clientY + pad;
  tip.style.left = x + 'px';
  tip.style.top  = y + 'px';
});
</script>
</body>
</html>
