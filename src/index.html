<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fix That Gap! — Wheel Fitment Calculator</title>
  <!-- %SEO% -->
  <meta name="theme-color" content="#f0b429">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fitment">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header>
  <h1>Fix That Gap!</h1>
  <p>Wheel &amp; Tire Fitment Calculator</p>
</header>
<main id="main-content">
  <div class="inputs">

    <div class="card old" role="group" aria-labelledby="current-heading">
      <h2 id="current-heading">Current Setup</h2>
      <h3 class="section-label">Rim</h3>
      <div class="field"><label for="o-d">Diameter (inches)</label><input type="number" id="o-d" value="17" step="1"></div>
      <div class="field"><label for="o-w">Width (inches)</label><input type="number" id="o-w" value="7.5" step="0.5"></div>
      <div class="field"><label for="o-et">Offset / ET (mm)</label><input type="number" id="o-et" value="45" step="1"></div>
      <h3 class="section-label">Tire</h3>
      <div class="field"><label for="o-tw">Width (mm)</label><input type="number" id="o-tw" value="225" step="5"></div>
      <div class="field"><label for="o-pr">Profile (%)</label><input type="number" id="o-pr" value="45" step="5"></div>
      <h3 class="section-label">Optional</h3>
      <div class="field"><label for="o-sp">Spacer (mm)</label><input type="number" id="o-sp" value="0" step="1" min="0"></div>
      <div class="field"><label for="o-cam">Camber (&deg;)</label><input type="number" id="o-cam" value="0" step="0.1"></div>
    </div>

    <div class="card new" role="group" aria-labelledby="new-heading">
      <h2 id="new-heading">New Setup</h2>
      <h3 class="section-label">Rim</h3>
      <div class="field"><label for="n-d">Diameter (inches)</label><input type="number" id="n-d" value="18" step="1"></div>
      <div class="field"><label for="n-w">Width (inches)</label><input type="number" id="n-w" value="8.5" step="0.5"></div>
      <div class="field"><label for="n-et">Offset / ET (mm)</label><input type="number" id="n-et" value="40" step="1"></div>
      <h3 class="section-label">Tire</h3>
      <div class="field"><label for="n-tw">Width (mm)</label><input type="number" id="n-tw" value="235" step="5"></div>
      <div class="field"><label for="n-pr">Profile (%)</label><input type="number" id="n-pr" value="40" step="5"></div>
      <h3 class="section-label">Optional</h3>
      <div class="field"><label for="n-sp">Spacer (mm)</label><input type="number" id="n-sp" value="0" step="1" min="0"></div>
      <div class="field"><label for="n-cam">Camber (&deg;)</label><input type="number" id="n-cam" value="0" step="0.1"></div>
    </div>

  </div>

  <div class="btn-row">
    <button class="calc-btn" type="button" onclick="calculate()">Calculate Fitment</button>
    <button class="share-btn" type="button" id="share-btn" onclick="_share()" aria-label="Copy share link">Share</button>
  </div>

  <div role="status" class="sr-only" id="calc-status"></div>
  <div id="results">
    <div class="table-wrap">
      <table aria-label="Fitment comparison measurements">
        <thead>
          <tr>
            <th scope="col">Measurement</th>
            <th scope="col" class="old">Current</th>
            <th scope="col" class="new">New</th>
            <th scope="col" class="diff">Difference</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="diagram-wrap">
      <h3>Cross Section Comparison</h3>
      <div class="legend" aria-hidden="true">
        <div class="legend-item"><div class="swatch" style="background:var(--old)"></div>Current Setup</div>
        <div class="legend-item"><div class="swatch" style="background:var(--new)"></div>New Setup</div>
      </div>
      <canvas id="cv" width="900" height="620"
        role="img"
        aria-label="Cross-section diagram comparing current and new wheel and tire setups"></canvas>
    </div>
  </div>
</main>
<footer>
  <p>Made with ❤️ and Miatas by Gio Coia</p>

</body>
</html>
