<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheels Fitment — Wheel Fitment Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Wheels Fitment</h1>
  <p>Wheel &amp; Tyre Fitment Calculator</p>
</header>
<main>
  <div class="inputs">

    <div class="card old">
      <h2>Current Setup</h2>
      <p class="section-label">Rim</p>
      <div class="field"><label>Diameter (inches)</label><input type="number" id="o-d" value="17" step="0.5"></div>
      <div class="field"><label>Width (inches)</label><input type="number" id="o-w" value="7.5" step="0.5"></div>
      <div class="field"><label>Offset / ET (mm)</label><input type="number" id="o-et" value="45" step="1"></div>
      <p class="section-label">Tyre</p>
      <div class="field"><label>Width (mm)</label><input type="number" id="o-tw" value="225" step="5"></div>
      <div class="field"><label>Profile (%)</label><input type="number" id="o-pr" value="45" step="5"></div>
      <p class="section-label">Optional</p>
      <div class="field"><label>Spacer (mm)</label><input type="number" id="o-sp" value="0" step="1" min="0"></div>
      <div class="field"><label>Camber (&deg;)</label><input type="number" id="o-cam" value="0" step="0.5"></div>
    </div>

    <div class="card new">
      <h2>New Setup</h2>
      <p class="section-label">Rim</p>
      <div class="field"><label>Diameter (inches)</label><input type="number" id="n-d" value="18" step="0.5"></div>
      <div class="field"><label>Width (inches)</label><input type="number" id="n-w" value="8.5" step="0.5"></div>
      <div class="field"><label>Offset / ET (mm)</label><input type="number" id="n-et" value="40" step="1"></div>
      <p class="section-label">Tyre</p>
      <div class="field"><label>Width (mm)</label><input type="number" id="n-tw" value="235" step="5"></div>
      <div class="field"><label>Profile (%)</label><input type="number" id="n-pr" value="40" step="5"></div>
      <p class="section-label">Optional</p>
      <div class="field"><label>Spacer (mm)</label><input type="number" id="n-sp" value="0" step="1" min="0"></div>
      <div class="field"><label>Camber (&deg;)</label><input type="number" id="n-cam" value="0" step="0.5"></div>
    </div>

  </div>

  <div class="btn-row">
    <button class="calc-btn" type="button" onclick="calculate()">Calculate Fitment</button>
  </div>

  <div id="results">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Measurement</th>
            <th class="old">Current</th>
            <th class="new">New</th>
            <th class="diff">Difference</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="diagram-wrap">
      <h3>Cross Section Comparison</h3>
      <div class="legend">
        <div class="legend-item"><div class="swatch" style="background:var(--old)"></div>Current Setup</div>
        <div class="legend-item"><div class="swatch" style="background:var(--new)"></div>New Setup</div>
      </div>
      <canvas id="cv" width="900" height="620"></canvas>
    </div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
